name: confidential-e2e
# Run this library's TEE-gated suite DIRECTLY on the ARC runner rail — the runner
# pod runs INSIDE a confidential VM, so the tests build + run as PLAIN STEPS (no
# archive, no serial console, no ci-tests OCI package). ONE matrix, per-platform
# cells because attestation-rs tests each attestation MECHANISM separately:
#   snp-metal-cvm : native SEV-SNP via /dev/sev-guest  (--features attest)
#   azure-snp-cvm : Azure SEV-SNP via the vTPM/HCL      (--features attest,az-snp,
#                   az_snp_live only — runnable nowhere else)
#   tdx-metal-cvm : native Intel TDX via /dev/tdx_guest (--features attest)
# Adding a platform later = one more include line.
# Trigger: push:main + dispatch. NEVER pull_request (org self-hosted hardware).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: confidential-e2e-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # ── PER-RUN ATTESTATION OF THE STANDING RUNNERS ──────────────────────────
  # These run alongside `tee`, not in front of it, so a green run means both
  # that the suite passed and that an attested environment answered to the
  # label for this run rather than only when it was provisioned.
  #
  # This suite proves a TEE is present and functional. It does not pin a
  # measurement, so it cannot tell one image from another. That is what these
  # add: if a standing runner is re-provisioned from a different image, or a
  # label starts pointing somewhere else, the suite would still pass and this
  # would not.
  #
  # Metal only for now. Both measurements below are published and verified.
  attest-snp-metal:
    uses: ./.github/workflows/attest-runner.yml
    with:
      runner: snp-metal-cvm
      platform: snp
      expected_launch_digest: '15bc995383ddcf1fee2107753e6c26bc65358602519a342b8ff8fbfdfa4b40865d90b11cef11b7d34934e6c5eed19115'

  attest-tdx-metal:
    uses: ./.github/workflows/attest-runner.yml
    with:
      runner: tdx-metal-cvm
      platform: tdx
      expected_mrtd: '9309eaae9c151e766de0f97b1d1aaeb76b8c8c366080803943fb566521c8f0cf00a142d8b7b0683ed1d42c5a27198ba1'

  tee:
    strategy:
      fail-fast: false              # one platform failing must not hide the other
      matrix:
        include:
          - platform: snp-metal
            runs_on: snp-metal-cvm
            features: attest
            filter: "not (binary(az_snp_live) | binary(az_tdx_live) | binary(capture_fixture))"  # az_* are the azure cell; capture_fixture is TDX
            test_threads: "2"
            tee_dev: /dev/sev-guest
          - platform: azure-snp
            runs_on: azure-snp-cvm
            features: "attest,az-snp"
            filter: "binary(az_snp_live)"             # the Azure vTPM tests, runnable nowhere else
            test_threads: "1"                         # the emulated vTPM serialises — 1 proc avoids session contention
            tee_dev: /dev/tpmrm0
          # tdx-metal: native TDX via /dev/tdx_guest (UNDERSCORE; the hyphen
          #   spelling is qemu's -object tdx-guest, a different string). Runner is
          #   the in-guest ARC scale set from confidential-ci provision-tdx-metal-cvm.yml,
          #   standing on tdx-gh-runner and scaling to zero at idle.
          #   The filter names the ONE native test rather than the whole binary:
          #   capture_fixture also holds capture_az_snp_evidence_fixture and
          #   capture_az_tdx_evidence_fixture, and since snp/tdx/az-snp/az-tdx are
          #   all DEFAULT features they compile in here too. A bare
          #   binary(capture_fixture) would run both Azure fixtures on bare metal,
          #   where there is no Azure vTPM or IMDS, and fail.
          - platform: tdx-metal
            runs_on: tdx-metal-cvm
            features: attest
            filter: "binary(capture_fixture) & test(capture_tdx_evidence_fixture)"
            test_threads: "2"
            tee_dev: /dev/tdx_guest
          # azure-tdx: Azure vTPM TDX (az_tdx_live, runnable nowhere else). Runner =
          #   a standalone DC4es_v6 TDX CVM in westus (confidential-ci
          #   provision-azure-tdx-cvm.yml): GA'd v6 sizes, but AKS still refuses TDX
          #   node pools (Azure/AKS#5618), hence not an azure-cvm AKS twin. Attests
          #   via vTPM + IMDS /acc/tdquote, so the device gate is /dev/tpmrm0, same
          #   as the SNP azure cell; nextest already serialises both az binaries in
          #   the max-1 vtpm group. Expect 14 EXECUTED tests here: az_tdx_live
          #   skips itself silently when IMDS says the VM is not TDX, and a
          #   skipped-green run tests nothing.
          - platform: azure-tdx
            runs_on: azure-tdx-cvm
            features: "attest,az-tdx"
            filter: "binary(az_tdx_live)"
            test_threads: "1"
            tee_dev: /dev/tpmrm0
    name: tee (${{ matrix.runs_on }})   # job name == runner label, matching kettle — grep-able straight to the runner
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    steps:
      - name: prove the runner is in the expected TEE before trusting any result
        run: |
          [ -e "${{ matrix.tee_dev }}" ] && echo "TEE confirmed: ${{ matrix.tee_dev }} present" \
            || { echo "::error::${{ matrix.tee_dev }} absent — this runner is not the expected ${{ matrix.platform }} TEE"; exit 1; }

      - name: "build deps (root runner pod: libtss2 + tpm2-tools for --features attest)"
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libtss2-dev tpm2-tools pkg-config build-essential curl ca-certificates git

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: install cargo-nextest
        run: |
          set -euo pipefail
          mkdir -p /usr/local/bin
          curl -fsSL --connect-timeout 10 --max-time 120 --retry 3 --retry-all-errors https://get.nexte.st/0.9/linux | tar -xz -C /usr/local/bin cargo-nextest
          cargo-nextest --version

      - name: "nextest --features ${{ matrix.features }} (TEE-gated tests run for real, in the guest)"
        env:
          # 4-core CVM with rke2-on-tmpfs (~5Gi free): cap parallelism + drop
          # debuginfo so the in-guest compile fits (unconstrained rustc OOM'd,
          # run 29801365953). Harmless on a larger node.
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: |
          cargo nextest run --workspace --features ${{ matrix.features }} \
            --run-ignored all -E '${{ matrix.filter }}' \
            --no-fail-fast --test-threads ${{ matrix.test_threads }}
