# A release published outside the CI release job (a tag pushed by hand, or a
# release the job could not name because its image was not built yet) still
# gets its image name: attestation-api:vX.Y.Z is added to the manifest CI
# pushed as sha-<7> for the release commit, never a rebuild. The CI release job
# does the same inline, since a release it creates with GITHUB_TOKEN does not
# fire this event.
name: image release tag
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to name the image after (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  name-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the release tag to its commit
        id: commit
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]] || {
            echo "::error::$TAG is not a release version (vMAJOR.MINOR.PATCH)"; exit 1; }
          read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object | "\(.type) \(.sha)"')
          # An annotated tag points at a tag object; follow it to the commit.
          while [ "$type" = tag ]; do
            read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object | "\(.type) \(.sha)"')
          done
          [ "$type" = commit ] || { echo "::error::$TAG does not end at a commit ($type $sha)"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Name the image after the release
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: bash .github/scripts/name-image-release.sh "$TAG" "$COMMIT"
