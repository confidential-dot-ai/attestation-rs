# cargo-audit configuration.

[advisories]
# RUSTSEC-2023-0071 — Marvin attack on `rsa` 0.9.10 (a direct
# dependency of `attestation`). No fixed upgrade is published.
#
# Not exploitable in this codebase: the `rsa` crate's PKCS#1 v1.5
# decryption path is the side-channel target, and we use `rsa` only
# for signature *verification* with public keys (the AMD certificate
# chain and CRL on the SNP paths; TPM quote signatures on the Azure
# vTPM overlays; NVIDIA and GCP certificates). Verification has no
# decryption oracle and therefore no Marvin exposure.
#
# Remove this ignore once a fixed `rsa` is published and adopted.
ignore = ["RUSTSEC-2023-0071"]
