[package]
name = "tcg-cel"
version = "0.1.0"
edition = "2021"
description = "TCG Canonical Event Log v1.1: CEL-CBOR and CEL-JSON codecs, register replay, and ingest from TCG2, CCEL, AAEL and dstack logs"
license = "Apache-2.0"
keywords = ["tpm", "tdx", "attestation", "event-log", "tcg"]
categories = ["encoding", "parser-implementations", "cryptography"]

[dependencies]
hex = "0.4"
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
