[package]
name = "attestation-wasm"
version = "0.1.0"
edition = "2021"

[lib]
# rlib alongside cdylib so the crate's native unit tests can link it — the
# RTMR[3] enforcement gate is tested off-wasm (see the tests module in lib.rs).
crate-type = ["cdylib", "rlib"]

[dependencies]
attestation = { path = "../attestation" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde_json = "1"
base64 = "0.22"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
