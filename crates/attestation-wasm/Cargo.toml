[package]
name = "attestation-wasm"
version = "0.1.0"
edition = "2021"

[lib]
# rlib alongside cdylib so the crate's native unit tests can link it — the
# RTMR[3] enforcement gate is tested off-wasm (see the tests module in lib.rs).
crate-type = ["cdylib", "rlib"]

[dependencies]
# dstack is TDX underneath. nvidia-gpu compiles for wasm32 but stays off: no
# NVIDIA-signed NRAS answer exists as a fixture to show a bundle verifying
# offline, and the NRAS answer is per nonce, so `collateral_needed` cannot
# name a URL a browser could fetch for it.
attestation = { path = "../attestation", features = ["dstack"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
