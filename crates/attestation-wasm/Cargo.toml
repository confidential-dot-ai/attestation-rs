[package]
name = "attestation-wasm"
version = "0.1.0"
edition = "2021"

[lib]
# rlib alongside cdylib so the crate's native unit tests can link it — the
# RTMR[3] enforcement gate is tested off-wasm (see the tests module in lib.rs).
crate-type = ["cdylib", "rlib"]

[dependencies]
# The pre-profile exports call platform internals until they are removed.
# nvidia-gpu is the NRAS token verifier (JWS and JSON, no network); NRAS
# exchanges reach it only as recorded inputs.
attestation = { path = "../attestation", features = ["unstable-internals", "nvidia-gpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
flate2 = "1"
