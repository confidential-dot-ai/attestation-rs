[server]
# Plain HTTP only; `[server.tls] enabled = true` is refused. Terminate TLS in
# front of the service: loopback for a sidecar, or an address only the
# terminator can reach for an ingress. Never expose this listener directly.
bind = "127.0.0.1:8400"
max_connections = 1024            # More wait in the backlog; bodies: at most 1 MiB each
max_open_files = 65536            # Soft limit to raise to, at most the hard limit

[verify]
workers = 0                       # 0 = two per vCPU
queue_per_worker = 8
queue_deadline_ms = 50            # Waiting longer for a worker: 503
cold_workers = 0                  # Verifications waiting on vendors (0 = max(8, 4 per vCPU))
fetch_deadline_ms = 10000         # Fetching longer: 502
# Collateral URLs fetched before serving (default: Intel's QE Identity and
# CRLs, AMD's CRLs); add each fleet FMSPC's TCB Info URL. warm = [...]

[auth]
# If non-empty, all endpoints (except /health) require a Bearer token.
# If empty or omitted, endpoints are unauthenticated (a warning is logged on startup).
api_keys = []

[nras]
gpu_url = ""                      # Empty = NV_NRAS_GPU_URL, else NVIDIA's endpoint
switch_url = ""                   # Empty = NV_NRAS_SWITCH_URL, else NVIDIA's endpoint

[token]
enabled = false
issuer = "attestation-api"
duration_minutes = 5
key_path = ""                     # Empty = ephemeral EC key

[attestation]
enabled = true                    # Set to false to disable the /attest endpoint
platforms = ["snp", "tdx", "az-snp", "az-tdx", "gcp-snp", "gcp-tdx"]
allow_debug = false               # Accept /verify policies with allow_debug = true
allow_revoked_or_unlisted_tcb = false  # Accept "Revoked" or "NoMatchingLevel" in accepted_tcb_statuses
allow_nonzero_vmpl = false        # Accept max_vmpl above 0
