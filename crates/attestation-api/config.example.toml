[server]
# Plain HTTP only; `[server.tls] enabled = true` is refused. Terminate TLS in
# front of the service: loopback for a sidecar, or an address only the
# terminator can reach for an ingress. Never expose this listener directly.
bind = "127.0.0.1:8400"
# Verifications run on verify_threads threads (0: one per CPU); io_threads
# (0: one per four CPUs, at least two) serve connections and ask the
# vendors (collateral, NRAS). A /verify request that would wait more than
# max_queue_wait_ms for a thread gets 503 with Retry-After: 1 at once; one
# no thread took within queue_deadline_ms gets 503. Vendor requests for one
# /verify request may take fetch_deadline_ms in all; past that it gets 502
# collateral_unavailable with Retry-After. At most max_connections
# connections are served at once; a connection must send its request headers
# within 10 s, a request body within 10 s, and gets an answer within
# queue_deadline_ms + fetch_deadline_ms + 30 s.
# verify_threads = 0
# io_threads = 0
# max_queue_wait_ms = 30
# queue_deadline_ms = 200
# fetch_deadline_ms = 10000
# max_connections = 4096

[auth]
# If non-empty, all endpoints (except /health) require a Bearer token.
# If empty or omitted, endpoints are unauthenticated (a warning is logged on startup).
api_keys = []

[nras]
gpu_url = ""                      # Empty = NV_NRAS_GPU_URL, else NVIDIA's endpoint
switch_url = ""                   # Empty = NV_NRAS_SWITCH_URL, else NVIDIA's endpoint

[token]
enabled = false
issuer = "attestation-api"
duration_minutes = 5
key_path = ""                     # Empty = ephemeral EC key

[attestation]
enabled = true                    # Set to false to disable the /attest endpoint
platforms = ["snp", "tdx", "az-snp", "az-tdx", "gcp-snp", "gcp-tdx"]
allow_debug = false               # Accept /verify policies with allow_debug = true
allow_revoked_or_unlisted_tcb = false  # Accept "Revoked" or "NoMatchingLevel" in accepted_tcb_statuses
allow_nonzero_vmpl = false        # Accept max_vmpl above 0
