[package]
name = "attestation-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = { version = "1", features = ["raw_value"] }
hex = "0.4"
pem = "3"
attestation = { path = "..", default-features = false, features = ["snp", "tdx", "gcp-tdx", "gcp-snp", "nvidia-gpu"] }

# Not part of the repository workspace.
[workspace]
members = ["."]

[[bin]]
name = "gcp_endorsement"
path = "fuzz_targets/gcp_endorsement.rs"
test = false
doc = false
bench = false

[[bin]]
name = "collateral_documents"
path = "fuzz_targets/collateral_documents.rs"
test = false
doc = false
bench = false
